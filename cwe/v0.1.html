        <script>
const now = new Date();

const yearDigits = now.getUTCFullYear().toString().split("").map(Number);
const monthLetters = [now.toLocaleString(undefined, { timeZone: 'UTC' , month: "short" })];//.split("");
const twoDigits = (n) => n.toString().padStart(2, "0").split("").map(Number);
const dayDigits = twoDigits(now.getUTCDate());
const hourDigits = twoDigits(now.getUTCHours());
const minuteDigits = twoDigits(now.getUTCMinutes());
const secondDigits = twoDigits(now.getUTCSeconds());

var dateTimeArray = [
  ...yearDigits,
  ...monthLetters,
  ...dayDigits,
  ...hourDigits,
  ...minuteDigits,
  ...secondDigits
];

var selected_digit = -1;

function parsePathPoints(d) {
  return d
    .replace(/[A-Za-z]/g, '')      // remove M, L, Z, etc, ignoring what they are
    .trim()
    .split(/\s+/)
    .map(pair => pair.split(',').map(Number));
}
function pointsToPath(points) {
  if (!points || points.length === 0) return '';

  return points
    .map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`)
    .join(' ');
}

const w_center = parsePathPoints(document.getElementById("path24").getAttribute("d"))[0];
const moon_circle_points = parsePathPoints(document.getElementById("path364").getAttribute("d"));

const moon_center = [Math.floor(0.5+(moon_circle_points[0][0]+moon_circle_points[Math.floor(moon_circle_points.length/2)][0])/2),Math.floor(0.5+(moon_circle_points[0][1]+moon_circle_points[Math.floor(moon_circle_points.length/2)][1])/2)];
const moon_dist = Math.sqrt((moon_center[0]-w_center[0])**2+(moon_center[1]-w_center[1])**2);
const moon_rad = Math.sqrt((moon_center[0]-moon_circle_points[0][0])**2+(moon_center[1]-moon_circle_points[0][1])**2);

function changeTime(){
    var input = dateTimeArray.join("");
    // const input = "2026Jan06170320";

    // 2026Jan06170320 becomes 2026-Jan-06 17:03:20Z
    // Z is necessary for it to be read as UTC
    const isoString = input.replace(
      /(\d{4})(\w{3})(\d{2})(\d{2})(\d{2})(\d{2})/,
      (_, y, m, d, hh, mm, ss) => `${y}-${m}-${d} ${hh}:${mm}:${ss}Z`
    );
    const date = new Date(isoString);
    const unixSeconds = date.getTime() / 1000;
    const j2000 = Date.UTC(2000, 0, 1, 12, 0, 0) / 1000;
    const secondsSinceJ2000 = unixSeconds - j2000;

    // sun theta
    var zodiac_theta = -1.75+30-15+11+180+360*(secondsSinceJ2000/86400/365.2425%1);
    document.getElementById("g362").setAttribute("transform","rotate("+zodiac_theta+",250,290)");

    var seconds_hand_theta = Math.PI*2*(secondsSinceJ2000%60)/60;
    var seconds_hand_x = 250+160*Math.cos(-Math.PI/2+seconds_hand_theta);
    var seconds_hand_y = 700+160*Math.sin(-Math.PI/2+seconds_hand_theta);
    document.getElementById("path22").setAttribute("d","M250.0,700.0 "+seconds_hand_x+","+seconds_hand_y+"");
    var minutes_hand_theta = Math.PI*2*(Math.floor(secondsSinceJ2000/60)%60)/60;
    var minutes_hand_x = 250+150*Math.cos(-Math.PI/2+minutes_hand_theta);
    var minutes_hand_y = 700+150*Math.sin(-Math.PI/2+minutes_hand_theta);
    document.getElementById("path20").setAttribute("d","M250.0,700.0 "+minutes_hand_x+","+minutes_hand_y+"");
    var hours_hand_theta = Math.PI*2*(Math.floor(secondsSinceJ2000/3600)%12)/12;
    var hours_hand_x = 250+100*Math.cos(-Math.PI/2+hours_hand_theta);
    var hours_hand_y = 700+100*Math.sin(-Math.PI/2+hours_hand_theta);
    document.getElementById("path18").setAttribute("d","M250.0,700.0 "+hours_hand_x+","+hours_hand_y+"");


    // the moon
    const synodic_month = 29.5305888531;// + 0.00000021621T − 3.64×10−10T2
    var moon_theta = 0.13700325398437485/2-1.5894884652059416+Math.PI/2-Math.PI/6+2*Math.PI-2*Math.PI*((secondsSinceJ2000/86400/synodic_month)%1);

    var current_moon_center = [w_center[0]+moon_dist*Math.cos(moon_theta),w_center[1]+moon_dist*Math.sin(moon_theta)];
    var moon_points = parsePathPoints(document.getElementById("path364").getAttribute("d"));
    var white_circle_coords = [];
    var path_coords = [];
    const num_points = 101;
    for(var i = 0;i<101;i+=1){
        var point_theta = Math.PI*2*i/(num_points-1);
        if( i>num_points/2){
            path_coords.push([((-1)**Math.floor(-1+0.5+moon_theta/Math.PI))*Math.cos(Math.PI/2+moon_theta)*moon_rad*Math.cos(Math.PI/2+point_theta),moon_rad*Math.sin(Math.PI/2+point_theta)]);

        }else{
            path_coords.push([((-1)**Math.floor(-1+0.5+moon_theta/Math.PI))*moon_rad*Math.cos(Math.PI/2+point_theta),moon_rad*Math.sin(Math.PI/2+point_theta)]);
        }
        white_circle_coords.push([current_moon_center[0]+moon_rad*Math.cos(point_theta),current_moon_center[1]+moon_rad*Math.sin(point_theta)])
        //rotate moon_theta
        path_coords[i] = [current_moon_center[0]+Math.cos(-Math.PI/2-moon_theta)*path_coords[i][0]+Math.sin(-Math.PI/2-moon_theta)*path_coords[i][1],
                            current_moon_center[1]-Math.sin(-Math.PI/2-moon_theta)*path_coords[i][0]+Math.cos(-Math.PI/2-moon_theta)*path_coords[i][1]];
    }
    var path_string = pointsToPath(path_coords);
    var white_circle_path_string = pointsToPath(white_circle_coords);

    document.getElementById("path366").setAttribute("d",path_string);
    document.getElementById("path364").setAttribute("d",white_circle_path_string);

    //rotate the earth
    var earth_theta = Math.PI-2*Math.PI*((secondsSinceJ2000/86400)%1);
    document.getElementById("earth").setAttribute("transform","translate(250,290),rotate("+(180/Math.PI*earth_theta)+"),translate(-40,-40)");
    var earth_hand_x = w_center[0]+100*Math.cos(Math.PI/2+earth_theta);
    var earth_hand_y = w_center[1]+100*Math.sin(Math.PI/2+earth_theta);
    document.getElementById("path24").setAttribute("d",pointsToPath([w_center,[earth_hand_x,earth_hand_y]]));

    for(var i=0;i<100;i+=1){
        var digit_el = document.getElementById("digit_"+(1000+i));
        if(digit_el){
            digit_el.innerHTML = ""+dateTimeArray[i];
        }
    }
}
function incrementTime(){
    increaseTime(1);
    changeTime();
}
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function increaseTime(increase_amount){
    // increase_amount is in seconds

    var input = dateTimeArray.join("");
    // const input = "2026Jan06170320";

    // 2026Jan06170320 becomes 2026-Jan-06 17:03:20Z
    // Z is necessary for it to be read as UTC
    const isoString = input.replace(
      /(\d{4})(\w{3})(\d{2})(\d{2})(\d{2})(\d{2})/,
      (_, y, m, d, hh, mm, ss) => `${y}-${m}-${d} ${hh}:${mm}:${ss}Z`
    );
    const date = new Date(isoString);
    date.setUTCSeconds(date.getUTCSeconds() + increase_amount);


    // convert number to array of digits (as numbers)
    const digits = (n, len = 2) =>
      n.toString().padStart(len, "0").split("").map(Number);

    const result = [
      ...digits(date.getUTCFullYear(), 4),
      months[date.getUTCMonth()],
      ...digits(date.getUTCDate(), 2),
      ...digits(date.getUTCHours(), 2),
      ...digits(date.getUTCMinutes(), 2),
      ...digits(date.getUTCSeconds(), 2),
    ];

    dateTimeArray = result;

}
changeTime();
setInterval(incrementTime, 1000);

for(var i=0;i<100;i+=1){
    var digit_el = document.getElementById("digit_"+(1000+i));
    if(digit_el){
        digit_el.innerHTML = ""+dateTimeArray[i];
        
        // Get the parent <g>
        const group = digit_el.parentNode;
        // box around the digit
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");

        var rect_width = 30;
        if(i==4){
            rect_width=90;
        }

        rect.setAttribute("x", parseFloat(digit_el.getAttribute("x"))-rect_width/2);
        rect.setAttribute("y", parseFloat(digit_el.getAttribute("y"))-25);
        rect.setAttribute("width", rect_width);
        rect.setAttribute("height", 50);
        rect.setAttribute("fill", "#a1bbed");

        // Insert rectangle before the digit
        group.insertBefore(rect, group.firstChild);
    }
}

addEventListener("keydown", function(e) {
    // space and arrow keys
    if([37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
    }
}, false);
document.onkeydown = function(e) {
    if(selected_digit>-1){
        const seconds_amounts = [1000*365*24*60*60,100*365*24*60*60,10*365*24*60*60,365*24*60*60,30*24*60*60,10*24*60*60,24*60*60,10*60*60,60*60,10*60,60,10,1];
        
        var digit_el = document.getElementById("digit_"+(1000+selected_digit));
        if(digit_el){
            var seconds = seconds_amounts[selected_digit];
            // Add 10 days for days tens digit
            if(e.keyCode==38){
                increaseTime(seconds);
            }else if(e.keyCode==40){
                increaseTime(-seconds);
            }

            if(e.keyCode>=48&&e.keyCode<58){
                if(selected_digit!=4){
                    increaseTime(seconds*(e.keyCode-48-dateTimeArray[selected_digit]));
                }
            }
        }

        changeTime();
        if(e.keyCode>=48&&e.keyCode<58||e.keyCode==39){
            // digits
            selected_digit+=1;
        }else if(e.keyCode==37){
            selected_digit-=1;
        }
        for(var i=0;i<100;i+=1){
            var digit_el = document.getElementById("digit_"+(1000+i));
            if(digit_el){
                if(i==selected_digit){
                    digit_el.parentNode.firstChild.setAttribute("fill", "#ecd85e");
                }else{
                    digit_el.parentNode.firstChild.setAttribute("fill", "#a1bbed");
                }
            }
        }
    }
};
window.addEventListener("wheel", event => {
    event.deltaY;
});
addEventListener("mousedown", (event) => {
    selected_digit = -1;
    for(var i=0;i<100;i+=1){
        var digit_el = document.getElementById("digit_"+(1000+i));
        if(digit_el){
            // digit_el.innerHTML = ""+dateTimeArray[i];
            var rect_width = 30;
            if(i==4){
                rect_width=90;
            }
            if(Math.abs(event.clientX-digit_el.getAttribute("x"))<rect_width/2&&Math.abs(event.clientY-digit_el.getAttribute("y"))<25){
                // digit_el.innerHTML = "0";
                selected_digit = i;
                digit_el.parentNode.firstChild.setAttribute("fill", "#ecd85e");

            }
        }
    }
    for(var i=0;i<100;i+=1){
        var digit_el = document.getElementById("digit_"+(1000+i));
        if(digit_el){
            if(i==selected_digit){
                digit_el.parentNode.firstChild.setAttribute("fill", "#ecd85e");
            }else{
                digit_el.parentNode.firstChild.setAttribute("fill", "#a1bbed");
            }
        }
    }
});

        </script>
